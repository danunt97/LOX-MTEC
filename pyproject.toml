[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MTECmqtt"
description = "Read data from a M-TEC Energybutler system and forward it to a Loxone Miniserver (LOX-MTEC) or a MQTT broker"
dependencies = [
  "pyyaml",
  "requests",
  "PyModbus > 3.8",
  "paho-mqtt >= 2.1",
  "flask >= 3.0",
  "waitress >= 2.1",
]
requires-python = ">=3.10"
authors = [
  {name = "Christian Rödel", email = "christian@roedel.info"},
]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["MTEC", "PV", "Loxone", "mqtt", "inverter", "modbus"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3"
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest >= 7.0"]

[project.urls]
Repository = "https://github.com/danunt97/LOX-MTEC"
Upstream = "https://github.com/croedel/MTECmqtt"

[project.scripts]
# LOX-MTEC: Modbus -> Loxone bridge incl. web GUI and watchdog
loxmtec = "loxmtec.main:main"
# Original MTECmqtt tools
mtec_mqtt = "mtecmqtt.mtec_mqtt:main"
mtec_export = "mtecmqtt.mtec_export:main"
mtec_util = "mtecmqtt.mtec_util:main"

[tool.setuptools]
script-files = ["src/install_systemd_service.sh"]

[tool.setuptools.dynamic]
version = {attr = "mtecmqtt.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mtecmqtt*", "loxmtec*"]

[tool.setuptools.package-data]
mtecmqtt = ["*.yaml"]
loxmtec = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
