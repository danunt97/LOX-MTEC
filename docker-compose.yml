# LOX-MTEC - M-TEC Energybutler -> Loxone Miniserver
#
# Synology: Container Manager -> Projekt -> Erstellen -> diesen Inhalt einfuegen.
# Kommandozeile: docker compose up -d
#
# Danach die Weboberflaeche unter http://<NAS-IP>:8080 oeffnen und dort alles
# Weitere einstellen. Mehr als diese Datei wird nicht gebraucht.
services:
  loxmtec:
    image: ghcr.io/danunt97/lox-mtec:latest
    container_name: loxmtec
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      # Benanntes Volume - Docker legt es mit den richtigen Rechten an.
      # Wer lieber einen Ordner auf der NAS haette, ersetzt die Zeile durch
      #   - ./config:/config
      # und fuehrt einmalig "sudo chown -R 1000:1000 ./config" aus.
      - loxmtec-config:/config

    environment:
      TZ: Europe/Berlin

volumes:
  loxmtec-config:
